name: Rebuild map
on:
  schedule:
    - cron: "0 6 10 * *"   # 10th of each month
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas
      - run: python build_map.py https://files.ember-energy.org/public-downloads/customs/outputs/clean_tech_exports_full_release_monthly.csv index.html ne_110m_admin_0_countries.geojson
      - run: |
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Monthly data rebuild" && git push || echo "No changes"
